</style><header><div class="brand"><span>✳</span>MSS AI提效平台</div><nav><span>首页</span><span>AI快讯</span><span>外部工具精选</span><span>内部办公推荐</span><span>AI工具Hub</span></nav><span class="mode">AI 智库 · 验证版</span></header><div class="layout" id="layout"><main class="main idle" id="main"><div class="bar"><span>AI 智库　<button class="mode-btn" data-mode="solution" aria-pressed="true">找方案</button>　<button class="mode-btn" data-mode="insight" aria-pressed="false">看洞察</button></span><button id="historyToggle">历史对话</button></div><div class="welcome"><div class="ip" aria-label="MSS智库占位角色">••</div></div><div class="scroll" id="scroll"><div id="messages" aria-live="polite"></div><div id="plan"></div><div id="processing" class="process" hidden></div></div><div class="composer"><div id="error" class="error" role="alert" hidden></div><form class="inputbox" id="form"><textarea id="input" aria-label="输入需求" placeholder="问问智库，或说说你想做的事"></textarea><div class="inputfoot"><span id="status">连接平台模型与资料</span><button class="primary send" id="send" aria-label="发送">↑</button></div></form><div class="quick"><button id="sample">找方案</button><button id="insightSample">看洞察</button></div><div class="hint">真实模型与平台数据 · 方案由你确认后保存</div></div></main><aside><button class="new" id="new">＋ 新建对话</button><p class="recent">最近对话</p><div class="history" id="history"></div></aside></div><dialog id="confirm"><h2>看看我是否理解准确</h2><dl id="understanding"></dl><div class="modalactions"><button id="cancel">返回继续聊</button><button class="primary" id="generate">确认生成方案</button></div></dialog><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api='http://localhost:3000/api/v1/ai-knowledge/pilot';let visitor=localStorage.getItem('mss-pilot-visitor');if(!visitor){visitor='pilot-'+crypto.randomUUID();localStorage.setItem('mss-pilot-visitor',visitor)}let current=null,busy=false,history=[],retryText='',mode='solution';
function safeUrl(value){try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
async function request(path,body){const res=await fetch(api+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Visitor-Id':visitor,...(sessionStorage.getItem('mssclaw_auth_token')?{Authorization:'Bearer '+sessionStorage.getItem('mssclaw_auth_token')}:{}),...(localStorage.getItem('mssclaw_api_auth')?{'X-API-Key':localStorage.getItem('mssclaw_api_auth')}:{} )},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(125000)});let data;try{data=await res.json()}catch{throw Error('后端响应异常，请稍后重试。')}if(!res.ok)throw Error(Array.isArray(data.message)?data.message.join('；'):(data.message||'请求失败'));return data}
function failure(e){$('error').replaceChildren();const text=document.createElement('span');text.textContent=(e instanceof TypeError?'无法连接后端，请检查服务是否已启动。':e.message||'请求失败，请重试。')+' ';$('error').append(text);if(retryText){const b=document.createElement('button');b.textContent='重新发送';b.onclick=()=>send(retryText);$('error').append(b)}$('error').hidden=false}
function setBusy(value,label){busy=value;$('processing').hidden=!value;$('processing').textContent=label||'';$('input').disabled=value;document.querySelectorAll('#send,#new,#sample,#insightSample,.mode-btn,#toSolution,#history button').forEach(b=>b.disabled=value);$('generate').disabled=value;}
function sourceButtons(sources){return sources?.length?'<div class="refs">'+sources.map((s,i)=>'<button type="button" data-source="'+esc(s.id)+'">['+(i+1)+'] '+esc(s.label)+'</button>').join('')+'</div>':''}
function render(){document.querySelectorAll('.mode-btn').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.mode===mode));b.style.color=b.dataset.mode===mode?'#b82640':'#9a9da5'});$('input').placeholder=mode==='insight'?'想了解哪个主题、案例或近期变化？':'问问智库，或说说你想做的事';const ms=current?.messages||[];$('main').classList.toggle('idle',!ms.length);$('messages').innerHTML=ms.map((m,mi)=>'<div data-message-index="'+mi+'" class="msg '+m.role+'">'+(m.role==='assistant'?'<div class="name">智库</div>':'')+esc(m.text)+sourceButtons(m.sources)+'</div>').join('');if(current&&mode==='solution'&&current.mode!=='insight'&&!current.needsClarification&&!current.plan){$('messages').insertAdjacentHTML('beforeend','<div class="actions"><button class="primary" id="ready">整理成方案</button></div>');$('ready').onclick=openConfirm}if(current?.mode==='insight'&&current.messages.at(-1)?.sources?.length){$('messages').insertAdjacentHTML('beforeend','<div class="actions"><button id="toSolution">找适合我的方案</button></div>');$('toSolution').onclick=()=>{mode='solution';send('我想把上面的洞察转成适合我的实施方案，请先帮我确定业务需求。')}}$('plan').innerHTML='';if(current?.plan){const p=current.plan;$('plan').innerHTML='<article class="plan"><h2>'+esc(p.title)+'</h2><p>'+esc(p.summary)+'</p>'+p.steps.map((s,i)=>'<section class="step"><h3>'+(i+1)+'. '+esc(s.title)+'</h3><p>输入：'+esc(s.input||'无需额外材料')+'</p><p>产出：'+esc(s.output)+'</p><p>人工检查：'+esc(s.humanCheck||'确认结果符合业务要求')+'</p>'+sourceButtons(p.sources.filter(r=>s.resourceIds.includes(r.id)))+'</section>').join('')+'<div class="limitations">'+p.limitations.map(l=>'<p>'+esc(l)+'</p>').join('')+'</div>'+sourceButtons(p.sources)+'<div class="save-state">已保存方案</div><span class="badge">模型：'+esc(p.model)+'</span></article>'}$('status').textContent=current?.model?'本地验证模型：'+current.model:'连接平台模型与资料';$('history').replaceChildren();for(const s of history){const b=document.createElement('button');b.textContent=s.title;b.className=current?.id===s.id?'active':'';b.disabled=busy;b.onclick=async()=>{if(busy)return;try{current=await request('/sessions/'+s.id);mode=current.mode||'solution';$('error').hidden=true;$('layout').classList.remove('show-history');render()}catch(e){failure(e)}};$('history').append(b)}$('scroll').scrollTop=$('scroll').scrollHeight;}
async function refreshHistory(){try{history=(await request('/sessions')).sessions;render()}catch(e){failure(e)}}
async function send(value){if(busy)return;const text=value.trim();if(!text)return;retryText=text;$('main').classList.remove('idle');$('error').hidden=true;setBusy(true,mode==='insight'?'正在查找资料并整理洞察…':'正在检索平台资料并分析需求…');try{current=await request(current?'/sessions/'+current.id+'/messages':'/sessions',{message:text,mode});mode=current.mode||mode;$('input').value='';retryText='';await refreshHistory()}catch(e){failure(e)}finally{setBusy(false);render();if(!current){$('input').value=text}}}
function openConfirm(){if(!current||busy)return;const names={task:'要完成的事',goal:'业务目标',inputs:'现有材料',output:'期望产出',constraints:'关键限制'};$('understanding').innerHTML=Object.entries(names).map(([k,n])=>'<dt>'+n+'</dt><dd>'+esc(current.understanding[k]||'尚未提供；方案会注明限制')+'</dd>').join('');$('confirm').showModal()}
$('generate').onclick=async()=>{if(busy||!current)return;$('confirm').close();$('error').hidden=true;setBusy(true,'正在生成方案并保存…');try{current=await request('/sessions/'+current.id+'/plan',{confirmed:true});await refreshHistory()}catch(e){failure(e)}finally{setBusy(false);render()}};$('cancel').onclick=()=>$('confirm').close();$('form').onsubmit=e=>{e.preventDefault();send($('input').value)};$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send($('input').value)}};$('new').onclick=()=>{if(busy)return;current=null;retryText='';$('error').hidden=true;$('input').value='';document.querySelector('.panel')?.remove();render()};$('sample').onclick=()=>{mode='solution';render();$('input').value='我是产品经理，想让 AI 帮我写需求文档';$('input').focus()};$('insightSample').onclick=()=>{mode='insight';render();$('input').value='最近30天，营销领域的AI有哪些值得关注的变化？';$('input').focus()};document.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>{if(!busy){mode=b.dataset.mode;render()}});$('historyToggle').onclick=()=>$('layout').classList.toggle('show-history');document.addEventListener('click',e=>{const id=e.target.closest('[data-source]')?.dataset.source;if(!id)return;const mi=e.target.closest('.msg')?.dataset.messageIndex;const sources=mi!==undefined?(current?.messages?.[Number(mi)]?.sources||[]):(current?.plan?.sources||[]);const s=sources.find(r=>r.id===id);if(!s)return;document.querySelector('.panel')?.remove();const p=document.createElement('section');p.className='panel';p.innerHTML='<button class="close">关闭</button><h2>参考来源</h2><h3>'+esc(s.label)+'</h3><span class="sourcekind">'+esc({tool:'平台工具',agent:'Agent',skill:'Skill',case:'案例洞察',news:'AI快讯',report:'报告'}[s.kind]||s.kind)+'</span><p>'+esc(s.description||'暂无详细描述')+'</p><p>'+esc(s.evidence||'')+'</p>'+(Object.hasOwn(s,'publishedAt')?'<p>'+esc(s.dateLabel||'日期')+'：'+esc(s.publishedAt?new Date(s.publishedAt).toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai'}):'未知')+'<br>'+esc(s.contentLevel==='summary'?'仅有摘要':'资料正文片段')+'</p>':'')+(safeUrl(s.url)?'<a target="_blank" rel="noopener noreferrer" href="'+esc(safeUrl(s.url))+'">打开原文 / 资产</a>':'');p.querySelector('button').onclick=()=>p.remove();document.body.append(p)});fetch('http://localhost:3000/api/v1/auth/me',{headers:sessionStorage.getItem('mssclaw_auth_token')?{Authorization:'Bearer '+sessionStorage.getItem('mssclaw_auth_token')}:{} }).then(r=>r.json()).then(me=>{document.querySelector('.mode').textContent='AI 智库 · '+(me.ok?'已登录':'访客');}).catch(()=>{});refreshHistory();
</script></html>
