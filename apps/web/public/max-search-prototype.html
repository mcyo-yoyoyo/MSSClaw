<section class="screen" id="chat"><div class="chat-top"><button class="icon-back" id="back" aria-label="返回搜索现场">‹</button><strong id="chatTitle">MAX</strong><span class="readonly">交互演示</span></div><div class="chat-flow" id="flow"></div><form class="chat-compose" id="chatForm"><textarea id="chatInput" placeholder="继续和 MAX 聊聊…" aria-label="继续提问"></textarea><footer><span>示例回复，未调用模型</span><button class="submit" id="chatSend" disabled aria-label="发送">↑</button></footer></form></section>
<div class="dialog" id="dialog"><section class="dialog-box" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div id="dialogContent"></div><div class="dialog-buttons"><button id="dialogClose">关闭</button><button id="dialogNext" hidden>下一步</button></div></section></div>
<script>
const $=id=>document.getElementById(id),entry=$('entry'),q=$('query'),tray=$('tray');let mode='search',locked=false,results=null,hoverTimer,replyTimer,chatMode='solution',guideStep=0,dialogReturn=null;
const labels={search:'搜工具',solution:'找方案',insight:'做洞察'},placeholders={search:'输入工具名称或关键词，如 PPT、翻译…',solution:'告诉 MAX，你想用 AI 完成什么工作…',insight:'想了解哪个主题、案例或近期变化？'};
const items=[{name:'PPT 生成 Agent',kind:'Agent',desc:'根据内容和提纲，辅助整理汇报初稿。',tags:'PPT 汇报 演示 文稿',icon:'▣'},{name:'数据分析 Agent',kind:'Agent',desc:'辅助分析销售、渠道和零售数据。',tags:'数据 销售 分析 周报',icon:'◕'},{name:'营销 Agent',kind:'Agent',desc:'梳理市场洞察，形成分析与行动建议。',tags:'营销 市场 洞察 销售',icon:'◴'},{name:'文档翻译 Skill',kind:'Skill',desc:'辅助处理文档翻译和术语一致性。',tags:'翻译 文档 语言 PPT',icon:'文'},{name:'AiPPT',kind:'工具',desc:'从主题或文档制作演示文稿。',tags:'PPT 演示 汇报',icon:'P'}];
const suggestions={search:['PPT','翻译','市场洞察'],solution:['帮我整理每周销售汇报','给新品上市做一份市场分析'],insight:['AI 客服有哪些落地案例？','看看 AI 在营销中的应用']};
function esc(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cards(list){return '<div class="cards">'+list.map(a=>`<button class="asset" data-asset="${items.indexOf(a)}"><span class="asset-head"><span class="asset-icon">${a.icon}</span><span><strong>${a.name}</strong><small>${a.kind}</small></span></span><p>${a.desc}</p></button>`).join('')+'</div>'}
function open(pin=false){clearTimeout(hoverTimer);if(pin)locked=true;entry.classList.add('open');q.placeholder=placeholders[mode];$('modeName').textContent=labels[mode];$('hint').textContent=locked?'Esc 收起，内容保留':'选择模式，再说说你的需求';paintTray()}
function close(){entry.classList.remove('open','has-tray');locked=false;tray.classList.remove('show');$('hint').textContent='选择模式，或直接输入关键词';$('modeName').textContent='';q.placeholder='搜工具，或告诉 MAX 你想做什么…'}
function paintTray(){if(!entry.classList.contains('open'))return;if(mode==='search'&&results){tray.innerHTML=`<div class="result-heading"><span>「${esc(results.query)}」 · ${results.items.length} 个示例结果</span><span>关键词检索</span></div>`+(results.items.length?cards(results.items):'<p style="color:#9aa59e;font-size:12px">暂无匹配结果，可以换个关键词，或让 MAX 帮你梳理需求。</p>')+'<button class="ask" data-ask>不知道选哪个？让 MAX 帮我选 <span>›</span></button>'}else{tray.innerHTML=''}tray.classList.toggle('show',!!tray.innerHTML);entry.classList.toggle('has-tray',!!tray.innerHTML)}
function setMode(next){mode=next;open(true);document.querySelectorAll('[data-mode]').forEach(b=>{const on=b.dataset.mode===mode;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1});$('submit').setAttribute('aria-label',mode==='search'?'搜索':'发送');q.focus()}
entry.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')open()});entry.addEventListener('pointerleave',()=>{hoverTimer=setTimeout(()=>{if(!locked&&!entry.contains(document.activeElement))close()},200)});q.addEventListener('focus',()=>open(true));q.oninput=()=>{results=null;locked=true;$('clear').hidden=!q.value;$('submit').disabled=!q.value.trim();paintTray()};$('clear').onclick=()=>{q.value='';results=null;q.oninput();q.focus()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.querySelector('.tabs').onkeydown=e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const keys=Object.keys(labels),i=keys.indexOf(mode);setMode(keys[(i+(e.key==='ArrowRight'?1:2))%3])};
$('form').onsubmit=e=>{e.preventDefault();const text=q.value.trim();if(!text)return;open(true);if(mode==='search'){const words=text.toLowerCase().split(/\s+/);results={query:text,items:items.filter(a=>words.every(w=>(a.name+' '+a.tags).toLowerCase().includes(w)))};paintTray()}else enterChat(text,mode)};
tray.onclick=e=>{const prompt=e.target.closest('[data-prompt]'),asset=e.target.closest('[data-asset]');if(prompt){q.value=prompt.dataset.prompt;q.oninput();q.focus()}if(e.target.closest('[data-ask]'))enterChat('我在找「'+(results?.query||q.value)+'」相关能力，帮我选一个合适的。','solution');if(asset)showAsset(Number(asset.dataset.asset))};
function message(role,text){const el=document.createElement('article');el.className='message '+role;el.textContent=text;$('flow').append(el);return el}
function enterChat(text,next){clearTimeout(replyTimer);chatMode=next;$('chatTitle').textContent='MAX · '+labels[next];$('flow').replaceChildren();$('chatInput').value='';$('chatSend').disabled=true;$('chat').classList.add('visible');document.body.style.overflow='hidden';if(text)send(text);else message('assistant','你好，我是 MAX。你想了解什么，或准备用 AI 完成什么工作？');$('chatInput').focus()}
function send(text){message('user',text);const wait=document.createElement('div');wait.className='waiting';wait.innerHTML='MAX 正在回复 <span class="dots"><i></i><i></i><i></i></span>';$('flow').append(wait);$('chatSend').disabled=true;$('flow').scrollTop=$('flow').scrollHeight;replyTimer=setTimeout(()=>{wait.remove();message('assistant',chatMode==='insight'?'可以从知识检索、坐席辅助和服务质检三个方向看 AI 客服案例。比较时，重点关注知识维护、人工接管，以及业务效果的证据。\n\n你更关注客服团队提效，还是客户自助服务？':'可以先把任务拆成内容准备、能力选择和人工确认三个环节，再选择适合的 Agent 或 Skill。\n\n你是已经有现成资料，还是需要从头梳理内容？');if(chatMode==='solution'){const box=document.createElement('div');box.innerHTML=cards(items.slice(0,2));box.onclick=e=>{const a=e.target.closest('[data-asset]');if(a)showAsset(Number(a.dataset.asset))};$('flow').append(box)}$('chatSend').disabled=!$('chatInput').value.trim();$('flow').scrollTop=$('flow').scrollHeight},950)}
$('robot').onclick=()=>enterChat('', 'solution');$('back').onclick=()=>{clearTimeout(replyTimer);$('chat').classList.remove('visible');document.body.style.overflow='';open(true);q.focus()};$('chatInput').oninput=()=>{$('chatSend').disabled=!!$('flow').querySelector('.waiting')||!$('chatInput').value.trim()};$('chatForm').onsubmit=e=>{e.preventDefault();if($('chatSend').disabled)return;const text=$('chatInput').value.trim();$('chatInput').value='';send(text)};
function showDialog(){dialogReturn=document.activeElement;$('dialog').classList.add('open');$('dialogClose').focus()}
function closeDialog(){$('dialog').classList.remove('open');dialogReturn?.focus()}
function showAsset(i){const a=items[i];$('dialogNext').hidden=true;$('dialogContent').innerHTML=`<span style="color:#99a59c;font-size:11px">资产详情示意</span><h2 id="dialogTitle">${a.name}</h2><p>${a.desc}</p><p>此原型只演示打开资产详情的交互，正式接入后展示平台对应资产。</p>`;showDialog()}
const guideCopy=[['搜工具','输入名称或关键词，快速查找平台里的工具、Skill 与 Agent。'],['找方案','描述想完成的工作，让 MAX 帮你理清需求、推荐能力并生成方案。'],['做洞察','围绕资讯和案例提出问题，了解变化和可借鉴的做法。']];function guidePaint(){const c=guideCopy[guideStep];$('dialogContent').innerHTML='<div class="guide-steps">'+guideCopy.map((_,i)=>`<span class="${i<=guideStep?'on':''}"></span>`).join('')+`</div><h2 id="dialogTitle">${c[0]}</h2><p>${c[1]}</p>`;$('dialogNext').hidden=false;$('dialogNext').textContent=guideStep===2?'完成':'下一步'}$('guide').onclick=()=>{guideStep=0;guidePaint();showDialog()};$('dialogNext').onclick=()=>{if(guideStep===2)closeDialog();else{guideStep++;guidePaint()}};$('dialogClose').onclick=closeDialog;$('dialog').onclick=e=>{if(e.target===$('dialog'))closeDialog()};document.addEventListener('pointerdown',e=>{if(!entry.contains(e.target)&&!$('dialog').classList.contains('open')&&!$('chat').classList.contains('visible'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('dialog').classList.contains('open'))closeDialog();else if(!$('chat').classList.contains('visible')){q.blur();close()}}if(e.key==='Tab'&&$('dialog').classList.contains('open')){const buttons=[$('dialogClose'),...($('dialogNext').hidden?[]:[$('dialogNext')])],first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
let hintIndex=0;setInterval(()=>{if(document.visibilityState!=='visible'||document.activeElement===q||q.value||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const items=mode==='search'?['输入 PPT，找找演示文稿相关能力','输入翻译，查找文档与术语处理能力','输入营销，看看平台相关能力']:suggestions[mode];q.placeholder=items[hintIndex++%items.length]},5000);
const head=document.querySelector('.robot .vb-head');let frame;document.addEventListener('pointermove',e=>{if(!head||matchMedia('(prefers-reduced-motion:reduce)').matches)return;cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{const r=$('robot').getBoundingClientRect();const x=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/400));head.style.transform=`rotate(${x*6}deg)`})});
</script></body></html>
