</style><header><div class="brand"><span class="logo">✳</span>MSS AI <span class="muted" style="margin-left:18px">管理后台</span></div><span class="demo">交互原型 · 演示数据</span></header><div class="layout"><aside><p>运营管理</p><div>门户运营</div><div class="active">数据看板</div><p style="margin-top:32px">系统管理</p><div>用户管理</div><div>模型配置</div></aside><main><div class="crumb">管理后台 / 数据看板</div><h1>数据看板</h1><div class="tabs"><span>平台运营统计</span><span class="selected">AI 使用统计</span></div><section class="panel"><div class="heading"><h2>平台 Token 消耗</h2><span class="muted">全部平台模型调用 · 不受下方筛选影响</span></div><div class="totals"><div class="metric"><div class="label">累计消耗</div><div class="value" id="all"></div></div><div class="metric"><div class="label">今日消耗</div><div class="value" id="today"></div></div></div></section><section class="panel"><div class="heading"><h2>使用统计</h2><span class="muted" id="rangeLabel"></span></div><div class="filters"><button data-days="1" class="on">今天</button><button data-days="7">近 7 天</button><button data-days="30">近 30 天</button><button id="custom">自定义</button><span id="dates" hidden><input type="date" id="start"> 至 <input type="date" id="end"><button id="apply">应用</button></span></div><div class="stats"><div class="metric"><div class="label">MAX 对话人数</div><div class="value" id="people"></div></div><div class="metric"><div class="label">成功问答轮次</div><div class="value" id="rounds"></div></div><div class="metric"><div class="label">平台 Token 消耗</div><div class="value" id="tokens"></div></div><div class="metric"><div class="label">工具搜索次数</div><div class="value" id="searchCount"></div></div></div></section><section class="panel"><div class="record-head"><h2>MAX 使用记录</h2><div class="search"><input id="search" placeholder="搜索用户、会话或关键词" aria-label="搜索用户、会话或关键词"><select id="mode" aria-label="功能模式"><option value="">全部模式</option><option>找方案</option><option>做洞察</option><option>搜工具</option></select></div></div><div class="table-wrap"><table><thead><tr><th>用户</th><th>会话 / 搜索关键词</t
